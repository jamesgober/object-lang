# =============================================================================
#  R E P S   ·   object-lang
# =============================================================================
[package]
name    = "object-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Writes and reads object files and executables: ELF64 for x86-64 and AArch64 from a format-neutral model, with no linker or assembler involved."

# Keywords (5 max)
keywords = ["elf", "object-file", "executable", "relocation", "compiler"]

# Categories
categories = ["compilers", "encoding", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/object-lang"
repository    = "https://github.com/jamesgober/object-lang"
documentation = "https://docs.rs/object-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "object_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# None. No first-party crate is needed yet (see dev/ROADMAP.md, v0.2.0 dependency wiring).


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
